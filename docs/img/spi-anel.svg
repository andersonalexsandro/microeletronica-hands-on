<text x="410.0" y="282" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal" >A cada pulso de SCLK, os dois deslocam 1 bit para a esquerda.  Depois de 8 pulsos: mestre = 3C, escravo = A5.</text>
